name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Build and check
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug :app:lintDebug

      - name: Build and verify signed APK
        id: sign
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${ANDROID_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing signing alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/rapidcsac-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64

          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="app/build/outputs/apk/release/app-release.apk"
          "$sdk_tools/apksigner" verify --min-sdk-version 24 --print-certs "$apk" > "$RUNNER_TEMP/signing-report.txt"
          actual_certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signing-report.txt")
          expected_certificate=$(tr -d '\r\n' < .github/signing-certificate.sha256)
          test "$actual_certificate" = "$expected_certificate"

          version=$("$sdk_tools/aapt" dump badging "$apk" | sed -n "1s/.*versionName='\([^']*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

          mkdir -p dist
          cp "$apk" "dist/RapidCsAC-$version.apk"
          cp LICENSE .github/signing-certificate.sha256 dist/
          (cd dist && sha256sum "RapidCsAC-$version.apk" > SHA256SUMS)

      - name: Upload signed APK
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk-${{ github.sha }}
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk-${{ github.sha }}
          path: dist

      - name: Publish APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --title "RapidCsAC $GITHUB_REF_NAME" --generate-notes --latest
          fi
